components:
  schemas:
    ApprovalDecisionIn:
      properties:
        decision:
          type: string
          enum:
          - APPROVE
          - REJECT
          title: Decision
        approver_id:
          type: string
          maxLength: 64
          minLength: 2
          title: Approver Id
        comment:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Comment
          description: Reason for the decision. REQUIRED for REJECT (recorded in the
            reasoning trace).
        callback_id:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Callback Id
          description: Idempotency key of the callback delivery; duplicates replay
            the stored response
      additionalProperties: false
      type: object
      required:
      - decision
      - approver_id
      title: ApprovalDecisionIn
    Attachment:
      properties:
        filename:
          type: string
          maxLength: 200
          minLength: 1
          title: Filename
        content_type:
          type: string
          maxLength: 100
          title: Content Type
          default: text/plain
        content:
          type: string
          maxLength: 15000000
          title: Content
          description: Text content, or base64 when encoding='base64' (PDF, images,
            DOCX)
        encoding:
          type: string
          enum:
          - utf-8
          - base64
          title: Encoding
          default: utf-8
        source:
          type: string
          enum:
          - supplier
          - internal
          - email
          - unknown
          title: Source
          default: unknown
      additionalProperties: false
      type: object
      required:
      - filename
      - content
      title: Attachment
    EvalRequest:
      properties:
        cases:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Cases
          examples:
          - - FIN-001
            - FIN-003
      type: object
      title: EvalRequest
    EvidenceIn:
      properties:
        attachments:
          items:
            $ref: '#/components/schemas/Attachment'
          type: array
          maxItems: 10
          title: Attachments
        note:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Note
        po_ref:
          anyOf:
          - type: string
            pattern: ^PO-\d{3,8}$
          - type: 'null'
          title: Po Ref
      additionalProperties: false
      type: object
      title: EvidenceIn
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ProcessingRequest:
      properties:
        case_id:
          type: string
          pattern: ^[A-Z]{2,5}-\d{3,8}$
          title: Case Id
        invoice_ref:
          type: string
          maxLength: 64
          minLength: 1
          title: Invoice Ref
        vendor_id:
          type: string
          pattern: ^V-\d{3,6}$
          title: Vendor Id
        vendor_name:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Vendor Name
        amount:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
          title: Amount
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          title: Currency
        po_ref:
          anyOf:
          - type: string
            pattern: ^PO-\d{3,8}$
          - type: 'null'
          title: Po Ref
        document_type:
          type: string
          enum:
          - invoice
          - credit_note
          title: Document Type
          default: invoice
        requester_id:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Requester Id
        notes:
          anyOf:
          - type: string
            maxLength: 5000
          - type: 'null'
          title: Notes
        attachments:
          items:
            $ref: '#/components/schemas/Attachment'
          type: array
          maxItems: 10
          title: Attachments
      additionalProperties: false
      type: object
      required:
      - case_id
      - invoice_ref
      - vendor_id
      - amount
      - currency
      title: ProcessingRequest
    ReviewIn:
      properties:
        reviewer_id:
          type: string
          maxLength: 64
          minLength: 2
          title: Reviewer Id
        skill:
          type: string
          maxLength: 64
          minLength: 3
          title: Skill
        question:
          type: string
          maxLength: 64
          minLength: 3
          title: Question
        decision:
          type: string
          enum:
          - clear
          - concern
          title: Decision
        reason:
          type: string
          maxLength: 1000
          minLength: 10
          title: Reason
      additionalProperties: false
      type: object
      required:
      - reviewer_id
      - skill
      - question
      - decision
      - reason
      title: ReviewIn
      description: A person decides a judgement question the AI could not settle (uncertain
        or not answered).
    SubscriptionIn:
      properties:
        url:
          type: string
          title: Url
          examples:
          - http://localhost:9000/hooks
        events:
          items:
            type: string
          type: array
          title: Events
          default:
          - '*'
          examples:
          - - approval.requested
            - run.needs_information
            - run.completed
      type: object
      required:
      - url
      title: SubscriptionIn
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
tags:
- name: runs
  description: Start, inspect and resume workflow runs.
- name: approvals
  description: Human approval requests (with explanations) and decisions that resume
    the run.
- name: outcomes
  description: 'Outcome pool: every case''s current outcome / status.'
- name: webhooks
  description: Outbound status webhooks (HMAC-signed) and inbound signed approval
    callbacks.
- name: audit
  description: Hash-chained audit trail.
- name: evaluation
  description: Scenario evaluation and skill fixture tests.
- name: policy
  description: 'Read-only: the policy numbers the controls enforce and whether the
    policy text matches the verified baseline. Policy changes are maintenance releases,
    never live.'
- name: catalog
  description: Tools, skills, parsers, workflow and data contracts (introspection).
- name: ops
  description: Health.
servers:
- url: http://localhost:8080
  description: local (finagent serve / docker compose)
- url: https://{alb_dns}
  description: AWS ALB (terraform output api_url)
  variables:
    alb_dns:
      default: example.elb.amazonaws.com
