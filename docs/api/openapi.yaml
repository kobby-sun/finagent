  /approvals/{approval_id}/decision:
    post:
      tags:
      - approvals
      summary: Approve / reject; resumes the same run. Duplicate callback_id replays
        the stored response.
      operationId: decide_approvals__approval_id__decision_post
      parameters:
      - name: approval_id
        in: path
        required: true
        schema:
          type: string
          title: Approval Id
      - name: x-callback-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Callback-Id
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionIn'
            examples:
              approve - Cost Centre Manager (limit AUD 10k):
                summary: Approve as u-ccm-01 (Cost Centre Manager, AUD 10,000)
                description: Use for cases <= AUD 10k (FIN-005, FIN-007, FIN-017 ...).
                  Refused (403) above the limit.
                value:
                  decision: APPROVE
                  approver_id: u-ccm-01
                  comment: Checked
                  callback_id: swagger-ccm-1
              approve - Department Director (limit AUD 50k):
                summary: Approve as u-dd-01 (Department Director, AUD 50,000)
                description: FIN-001 (AUD 18,150), FIN-013, FIN-015, FIN-024, FIN-029.
                value:
                  decision: APPROVE
                  approver_id: u-dd-01
                  comment: Checked PO and receipt
                  callback_id: swagger-dd-1
              approve - Executive Director (limit AUD 250k):
                summary: Approve as u-ed-01 - refused for FIN-018 (AUD 330,000)
                value:
                  decision: APPROVE
                  approver_id: u-ed-01
                  callback_id: swagger-ed-1
              approve - CFO (limit AUD 1M):
                summary: Approve as u-cfo-01 (FIN-018)
                value:
                  decision: APPROVE
                  approver_id: u-cfo-01
                  callback_id: swagger-cfo-1
              co-approve - Financial Control:
                summary: Second approval by Financial Control (u-fc-01 / u-fc-02)
                description: 'Higher-risk cases need it: FIN-012 new vendor, FIN-013
                  overseas account, FIN-034 first payment after bank change.'
                value:
                  decision: APPROVE
                  approver_id: u-fc-02
                  comment: Financial Control co-approval
                  callback_id: swagger-fc-1
              refused - vendor creator (segregation of duties):
                summary: u-dd-02 created vendor V-1013 -> 403 for FIN-024
                value:
                  decision: APPROVE
                  approver_id: u-dd-02
                  callback_id: swagger-sod-1
              refused - expired delegation:
                summary: u-ccm-02's Department Director delegation expired -> 403
                  for FIN-029
                value:
                  decision: APPROVE
                  approver_id: u-ccm-02
                  callback_id: swagger-del-1
              duplicate click (send twice):
                summary: 'Send this twice: the second response is replayed (replayed=true),
                  nothing executes again'
                value:
                  decision: APPROVE
                  approver_id: u-ccm-01
                  callback_id: swagger-duplicate-1
              reject:
                summary: Reject - nothing is posted; outcome pool REJECTED_BY_APPROVER
                  (FIN-027)
                value:
                  decision: REJECT
                  approver_id: u-ccm-01
                  comment: Query with supplier
                  callback_id: swagger-reject-1
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '403':
          description: Approver lacks authority or violates segregation of duties
        '409':
          description: Approval already resolved; no effect
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
