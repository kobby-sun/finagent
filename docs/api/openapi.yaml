openapi: 3.1.0
info:
  title: finagent - Financial Processing RAG Workflow Agent
  description: 'Accounts-payable agent: RAG over finance policy, deterministic reconciliation,
    approval-gated simulated posting, resumable runs, hash-chained audit. **No real
    money movement.**<br/><br/>**Testing in Swagger:** 1) `POST /runs` -> *Try it
    out* -> pick a scenario from the **Examples** dropdown (each lists the expected
    result) -> Execute. 2) Copy `approval.approval_id` from the response. 3) `POST
    /approvals/{approval_id}/decision` -> pick an approver example -> Execute. 4)
    Check `GET /runs/{run_id}`, `GET /outcomes`, `GET /audit/verify`. Full guide:
    docs/api/swagger_testing.md'
  version: 0.1.0
paths:
  /healthz:
    get:
      tags:
      - ops
      summary: Healthz
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /runs:
    post:
      tags:
      - runs
      summary: 'Start run: execute until completion, failure or approval required'
      operationId: start_run_runs_post
      parameters:
      - name: include_audit
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Audit
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      - name: x-api-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
