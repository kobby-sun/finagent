                  approve as `u-ccm-01` -> refused (403); approve as `u-dd-01` ->
                  accepted.
                value:
                  case_id: FIN-001
                  invoice_ref: INV-AC-7781
                  vendor_id: V-1001
                  vendor_name: Acme Industrial Supplies Pty Ltd
                  amount: '18150.00'
                  currency: AUD
