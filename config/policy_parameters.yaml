# Baseline values of every policy number / list the hand-written controls enforce (catalog: src/finagent/governance/params.py).
# Changing a value is part of a policy maintenance release (git PR + tests + restart) - never a live change (docs/governance.md).
# cite: null = implementation interpretation (the policy states no number) - see docs/governance.md "Interpretations".
parameters:
  vendor.new_vendor_days: {value: 30, cite: FIN-POL-003#s3}   # A vendor younger than this is a higher-risk transaction (Financial Control co-approval).
  vendor.bank_change_hold_business_days: {value: 2, cite: FIN-POL-004#s2}   # Payment hold after a verified bank-account change.
  vendor.screening_max_age_hours: {value: 24, cite: FIN-POL-009#s4}   # Sanctions screening must be at most this old for an overseas bank account.
  sod.recent_change_business_days: {value: 5, cite: FIN-POL-001#s4}   # Whoever created/changed the vendor record may not approve for this many business days.
  sod.distinct_people_above_aud: {value: "25000", cite: FIN-POL-001#s4}   # Above this amount requester, receipter and approver must be different people.
  match.goods_abs_aud: {value: "50", cite: FIN-POL-002#s2}   # Goods price tolerance, absolute.
  match.goods_pct: {value: "0.01", cite: FIN-POL-002#s2}   # Goods price tolerance, share of the PO line value.
  match.services_abs_aud: {value: "100", cite: FIN-POL-002#s2}   # Services price tolerance, absolute.
  match.services_pct: {value: "0.02", cite: FIN-POL-002#s2}   # Services price tolerance, share of the PO line value.
  match.freight_abs_aud: {value: "75", cite: FIN-POL-002#s2}   # Freight variance when the PO permits freight.
  match.tax_tolerance_aud: {value: "0.05", cite: null}   # Rounding tolerance for tax vs PO tax rate (policy says 'assessed separately').
  credit.tax_tolerance_aud: {value: "0.05", cite: null}   # Rounding tolerance for credit-note GST.
  duplicates.fuzzy_amount_pct: {value: "0.005", cite: null}   # Amounts this close count as a fuzzy-duplicate signal ('probable match' interpretation).
  duplicates.fuzzy_date_window_days: {value: 14, cite: null}   # Invoice dates this close count as a fuzzy-duplicate signal.
  non_po.allowed_categories: {value: ["emergency", "lease", "membership", "statutory", "utilities"], cite: FIN-POL-012#s1}   # Categories that may be invoiced without a PO.
  non_po.repeat_window_days: {value: 90, cite: FIN-POL-012#s4}   # Look-back window for repeated non-PO use.
  non_po.repeat_threshold: {value: 2, cite: FIN-POL-012#s4}   # This many non-PO invoices (incl. the current one) from one supplier in the window -> escalate.
  non_po.director_max_aud: {value: "10000", cite: FIN-POL-012#s3}   # Non-PO up to this amount: Department Director; above: + Procurement Governance.
  fraud.escalation_indicator_count: {value: 2, cite: FIN-POL-005#s3}   # Distinct fraud indicators that trigger escalation.
  payment.default_terms_days: {value: 30, cite: FIN-POL-006#s1}   # Standard payment terms when none are agreed.
  payment.run_weekdays: {value: [1, 3], cite: FIN-POL-006#s2}   # Standard payment-run weekdays (0 = Monday).
